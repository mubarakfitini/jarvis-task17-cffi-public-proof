{
  "name": "One isolated public CFFI proof",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "approved_commit": {
          "description": "Exact reviewed uploaded commit SHA",
          "required": true,
          "type": "string"
        },
        "manifest_sha256": {
          "description": "Reviewed inputs/manifest.json SHA-256",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "one-cffi-public-proof",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "if": "github.repository == 'mubarakfitini/jarvis-task17-cffi-public-proof' && github.actor == 'mubarakfitini' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.run_number == 1 && github.event.repository.private == false",
      "runs-on": "windows-2022",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "env": {
        "APPROVED_COMMIT": "${{ inputs.approved_commit }}",
        "APPROVED_MANIFEST": "${{ inputs.manifest_sha256 }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "name": "Admit exact context and source before compiler setup",
          "shell": "cmd",
          "run": "\"%RUNNER_TOOL_CACHE%\\Python\\3.12.10\\x64\\python.exe\" -I -B \"%GITHUB_WORKSPACE%\\proof\\preflight.py\""
        },
        {
          "name": "One source build and synthetic smoke",
          "shell": "cmd",
          "run": "call proof\\build.cmd"
        },
        {
          "name": "Preserve bounded public build evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "cffi-candidate-${{ github.run_id }}",
            "path": "out/*",
            "if-no-files-found": "error",
            "retention-days": 1
          }
        }
      ]
    },
    "attest": {
      "needs": "build",
      "if": "github.repository == 'mubarakfitini/jarvis-task17-cffi-public-proof' && github.actor == 'mubarakfitini' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.run_number == 1 && github.event.repository.private == false && needs.build.result == 'success'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read",
        "id-token": "write",
        "attestations": "write"
      },
      "env": {
        "APPROVED_COMMIT": "${{ inputs.approved_commit }}",
        "APPROVED_MANIFEST": "${{ inputs.manifest_sha256 }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "name": "Read only this run artifact",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "cffi-candidate-${{ github.run_id }}",
            "path": "candidate"
          }
        },
        {
          "name": "Inspect without importing the candidate",
          "run": "python3 -I -B proof/verify_artifact.py inspect"
        },
        {
          "name": "Attest wheel and build record",
          "id": "attest",
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-path": "candidate/cffi-2.1.1-cp312-cp312-win_amd64.whl\ncandidate/build-record.json",
            "push-to-registry": false,
            "create-storage-record": false
          }
        },
        {
          "name": "Verify expected identity and exact digests",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "ATTESTATION_BUNDLE": "${{ steps.attest.outputs.bundle-path }}"
          },
          "run": "python3 -I -B proof/verify_artifact.py verify"
        },
        {
          "name": "Preserve verified evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "cffi-verification-${{ github.run_id }}",
            "path": "verified/*",
            "if-no-files-found": "error",
            "retention-days": 1
          }
        }
      ]
    }
  }
}
